server {
    listen 80;
    server_name app.YOURDOMAIN.com;

    # Redirect HTTP → HTTPS (Certbot will manage this block after ssl setup)
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name app.YOURDOMAIN.com;

    # Certbot will add ssl_certificate lines here
    # Run: certbot --nginx -d app.YOURDOMAIN.com

    root /var/www/kindred-givings;
    index index.html;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Serve static assets with long cache (content-hashed by Vite)
    location ~* \.(js|css|woff2?|ttf|otf|eot|ico|png|jpg|jpeg|gif|svg|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback — all routes serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Health check endpoint
    location /health {
        return 200 "OK\n";
        add_header Content-Type text/plain;
    }

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;
    gzip_min_length 1024;
}
